name: Rust

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3
      - name: Build
        run: cargo build --locked --verbose
      - name: Allow access by other FUSE users
        run: echo user_allow_other | sudo tee -a /etc/fuse.conf
      - name: Mount FUSE request counters
        run: mountpoint -q /sys/fs/fuse/connections || sudo mount -t fusectl fusectl /sys/fs/fuse/connections
      - name: Run tests
        run: cargo test --locked --verbose -- --test-threads=1
      - name: Test mount recovery
        timeout-minutes: 2
        run: sudo -E "$(command -v cargo)" test --locked --test mount_injector_test -- --ignored --test-threads=1
  static_checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust components
        run: rustup component add clippy rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --locked --all-features --all-targets -- -D warnings
