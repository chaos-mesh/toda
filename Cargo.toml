[package]
name = "toda"
version = "0.2.5"
authors = ["Yang Keao <keao.yang@yahoo.com>"]
edition = "2018"

[dependencies]
clap = { version = "4.6", features = ["derive"] }
nix = { version = "0.31", features = ["dir", "fs", "mount", "mman", "ptrace", "signal", "uio", "user"] }
anyhow = "1.0"
fuser = "0.18"
libc = "0.2"
async-trait = "0.1"
tokio = { version = "1.53", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0"
futures = "0.3"
derive_more = { version = "2.1", features = ["deref", "deref_mut", "from"] }
glob = "0.3"
bitflags = "2.13"
rand = "0.10"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
humantime-serde = "1.0"
slab = "0.4"
dynasmrt = "5.1"
procfs = "0.18"
itertools = "0.15"
retry = { version = "2.2", default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
jsonrpc-stdio-server = "18.0"
jsonrpc-derive = "18.0"
jsonrpc-core = "18.0"
jsonrpc-core-client = "18.0"

[dev-dependencies]
env_logger = "0.11"

[profile.release]
debug = true
